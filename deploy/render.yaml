# Render Blueprint — StockPulse AI (one-click deploy)
# Steps:
#   1. Push this repo to GitHub (see deploy/DEPLOY.md).
#   2. Render dashboard → New → Blueprint → select the repo → Apply.
#      This creates: stockpulse-db (Postgres), stockpulse-backend (Docker),
#      stockpulse-frontend (Node).
#   3. After the first deploy, copy each service's real public URL from the
#      Render dashboard and replace the two placeholder URLs marked below,
#      then redeploy both services (frontend MUST rebuild: NEXT_PUBLIC_*
#      values are baked in at build time).

databases:
  - name: stockpulse-db
    plan: free

services:
  - type: web
    name: stockpulse-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: ./deploy/backend.Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stockpulse-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        # ← STEP 3: replace with the real frontend URL, e.g.
        #   https://stockpulse-frontend.onrender.com
        value: https://stockpulse-frontend.onrender.com
      - key: STOCKPULSE_DEV_MODE
        value: "false"
      - key: DEV_MODE
        value: "false"
      - key: STOCKPULSE_SCHEDULER_ENABLED
        value: "true"

  - type: web
    name: stockpulse-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        # ← STEP 3: replace with the real backend URL + /api, e.g.
        #   https://stockpulse-backend.onrender.com/api
        value: https://stockpulse-backend.onrender.com/api
